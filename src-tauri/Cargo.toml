[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_Devices_FunctionDiscovery", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_Memory", "Win32_Media_Audio_Endpoints", "Win32_Storage_FileSystem", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_System_Wmi", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_ColorSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_System_Diagnostics_Etw", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Kernel", "Win32_Graphics_Dxgi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Time", "Win32_System_Registry", "Win32_Security", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Devices_Radios", "Foundation", "Foundation_Collections"] }
windows-core = "0.61"
encoding_rs = "0.8"
dirs = "5"
window-vibrancy = "0.8"
ureq = "2"
base64 = "0.22"
